/* ============ Pasaporte de Lengua · estilos ============ */
:root {
  --ink: #1b1f24; --muted: #5b6470; --line: #dfe3e8; --bg: #f7f4ef; --card: #ffffff;
  --pp: #0f5e63; --pp2: #0a3f44; --gold: #ffd166; --cream: #fbf6ea;
  --ok: #13a150; --ok-l: #e3f5ea; --ok-d: #0b6a35;
  --ko: #d1453b; --ko-l: #fde7e8; --ko-d: #a3262b;
  --mid: #c98500; --mid-l: #fff4d1;
  --c: #2c6bc4; --cl: #e7f0fb; --cd: #1b4a8f;
  --r: 16px;
  --sh: 0 1px 2px rgba(27,31,36,.06), 0 4px 14px rgba(27,31,36,.06);
}
.th-lit { --c: #d99a00; --cl: #fff4d1; --cd: #845c00; }
.th-nor { --c: #13a150; --cl: #e3f5ea; --cd: #0b6a35; }
.th-len { --c: #e5484d; --cl: #fde7e8; --cd: #a3262b; }
.th-pub { --c: #ef7b1a; --cl: #ffeddc; --cd: #a24d06; }
.th-gen { --c: #2c6bc4; --cl: #e7f0fb; --cd: #1b4a8f; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 400 19px/1.45 'Atkinson Hyperlegible Next', system-ui, -apple-system, sans-serif; -webkit-text-size-adjust: 100%; touch-action: manipulation; overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; -webkit-user-select: none; user-select: none; }
button:disabled { cursor: default; }
b, strong { font-weight: 700; }
i { font-style: italic; }
h1, h2, .disp { font-family: 'Bricolage Grotesque', system-ui, sans-serif; letter-spacing: -.01em; }
.ic { width: 1.2em; height: 1.2em; vertical-align: -.22em; flex: none; }
.muted { color: var(--muted); }
.small { font-size: 15px; }

/* ---------- esqueleto: cabecera, zona central con scroll y botonera fija ---------- */
#app { height: 100vh; height: 100dvh; display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: minmax(0, 1fr); }
header.top { display: flex; align-items: center; gap: 12px; padding: calc(10px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 10px max(16px, env(safe-area-inset-left)); background: #fff; border-bottom: 1px solid var(--line); min-height: 66px; position: relative; z-index: 2; }
.play header.top::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 4px; background: var(--c); }
main { overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 18px max(16px, env(safe-area-inset-right)) 28px max(16px, env(safe-area-inset-left)); }
.wrap { max-width: 840px; margin: 0 auto; }
footer.bar { display: flex; gap: 10px; padding: 12px max(16px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); background: #fff; border-top: 1px solid var(--line); box-shadow: 0 -6px 18px rgba(27,31,36,.05); z-index: 2; }
footer.bar > * { min-width: 0; }
.hbtn { width: 48px; height: 48px; border-radius: 50%; border: 0; background: #f1f3f5; display: grid; place-items: center; flex: none; }
.hbtn .ic { width: 26px; height: 26px; }
.htitle { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; flex: 1; }
.htitle .hk { font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.htitle b { font-family: 'Bricolage Grotesque', sans-serif; font-size: 21px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand { display: flex; align-items: center; gap: 10px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 22px; color: var(--pp); flex: 1; }
.brand .ic { width: 28px; height: 28px; color: var(--gold); background: var(--pp); border-radius: 50%; padding: 4px; }
.prog { display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; max-width: 46%; }
.prog i { width: 13px; height: 13px; border-radius: 50%; background: #e3e6ea; display: block; }
.prog i.now { background: var(--c); box-shadow: 0 0 0 3px var(--cl); }
.prog i.ok { background: var(--ok); } .prog i.ko { background: var(--ko); }

/* ---------- botones ---------- */
.btn { min-height: 56px; padding: 0 20px; border-radius: 14px; border: 2px solid transparent; font-weight: 700; font-size: 18px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; line-height: 1.15; text-align: center; min-width: 0; }
.btn .t { white-space: nowrap; }
.btn .ic { width: 22px; height: 22px; }
.btn.pri { background: var(--cd); color: #fff; }
.btn.sec { background: #fff; border-color: var(--line); color: var(--ink); }
.btn.ok { background: var(--ok); color: #fff; } .btn.ko { background: var(--ko); color: #fff; }
.btn.wide, .btn.grow { flex: 1; }
.btn:disabled { opacity: .45; }
.btn[aria-pressed="true"] { background: var(--mid-l); border-color: var(--mid); }
.home .btn.pri { background: var(--pp); }
.lnk { border: 0; background: none; color: var(--muted); font-size: 16px; display: inline-flex; gap: 6px; align-items: center; padding: 10px 4px; min-height: 44px; }

/* ---------- portada ---------- */
.hint { display: flex; gap: 12px; align-items: flex-start; background: #fff; border: 1px solid var(--line); border-left: 6px solid var(--c); border-radius: 12px; padding: 12px 14px; font-size: 16px; margin-bottom: 14px; }
.hint.ko { border-left-color: var(--ko); }
.passport { background: linear-gradient(160deg, #13777c 0%, var(--pp) 45%, var(--pp2) 100%); color: #fff; border-radius: 22px; padding: 18px 18px 16px; box-shadow: 0 10px 26px rgba(10,63,68,.28); position: relative; overflow: hidden; }
.passport::before { content: ''; position: absolute; inset: 8px; border: 1.5px solid rgba(232,196,106,.45); border-radius: 16px; pointer-events: none; }
.pp-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; position: relative; }
.pp-k { color: var(--gold); text-transform: uppercase; letter-spacing: .16em; font-size: 13px; font-weight: 700; }
.pp-t { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 32px; line-height: 1.05; margin: 4px 0 2px; }
.pp-s { color: #d6eef0; font-size: 16px; }
.pp-streak { display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,.12); border: 1px solid rgba(232,196,106,.5); border-radius: 999px; padding: 6px 14px 6px 10px; font-size: 15px; }
.pp-streak .ic { color: #ffb347; width: 24px; height: 24px; }
.pp-streak b { font-size: 22px; font-family: 'Bricolage Grotesque', sans-serif; }
.pp-stamps { position: relative; margin-top: 14px; background: var(--cream); border-radius: 14px; padding: 12px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
.pp-note { position: relative; color: #d6eef0; font-size: 14px; margin-top: 10px; }
.stamp { aspect-ratio: 1; border-radius: 50%; border: 3px dashed #cfc7b6; color: #b7af9f; display: grid; place-items: center; transform: rotate(-9deg); max-width: 104px; width: 100%; justify-self: center; }
.stamp .st-in { display: flex; flex-direction: column; align-items: center; gap: 2px; font-weight: 800; font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; text-align: center; line-height: 1.1; padding: 4px; }
.stamp .st-in .ic { width: 26px; height: 26px; }
.stamp.got { border: 5px double var(--cd); color: var(--cd); background: var(--cl); animation: stampin .6s cubic-bezier(.2,1.4,.4,1) both; }
.stamp:nth-child(2n) { transform: rotate(7deg); }
.stamp.sm { width: 52px; height: 52px; flex: none; border-width: 2px; }
.stamp.sm.got { border-width: 4px; }
.stamp.sm .st-in span { display: none; }
.stamp.sm .st-in .ic { width: 22px; height: 22px; }
@keyframes stampin { 0% { transform: scale(1.8) rotate(-30deg); opacity: 0; } 70% { transform: scale(.92) rotate(-6deg); opacity: 1; } 100% { transform: scale(1) rotate(-9deg); } }
.mision { margin: 16px 0 6px; width: 100%; display: flex; align-items: center; gap: 14px; text-align: left; border: 0; border-radius: 18px; padding: 16px 18px; background: linear-gradient(135deg, #2c6bc4, #1b4a8f); color: #fff; box-shadow: 0 8px 22px rgba(27,74,143,.25); }
.mision.done { background: linear-gradient(135deg, #1f9d58, #0b6a35); box-shadow: 0 8px 22px rgba(11,106,53,.22); }
.mi-ic { width: 54px; height: 54px; border-radius: 50%; background: rgba(255,255,255,.16); display: grid; place-items: center; flex: none; }
.mi-ic .ic { width: 30px; height: 30px; }
.mi-tx { display: flex; flex-direction: column; flex: 1; }
.mi-tx b { font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 800; }
.mi-tx span { font-size: 16px; opacity: .92; }
.mision .chev { width: 28px; height: 28px; }
h2.sec { font-size: 21px; font-weight: 800; margin: 22px 2px 10px; }
.dgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.dcard { display: grid; grid-template-columns: auto 1fr; grid-template-areas: 'ic tx' 'pr pr'; gap: 10px 12px; align-items: center; text-align: left; background: #fff; border: 1px solid var(--line); border-top: 6px solid var(--c); border-radius: var(--r); padding: 14px; box-shadow: var(--sh); }
.dc-ic { grid-area: ic; width: 50px; height: 50px; border-radius: 14px; background: var(--cl); color: var(--cd); display: grid; place-items: center; }
.dc-ic .ic { width: 28px; height: 28px; }
.dc-tx { grid-area: tx; display: flex; flex-direction: column; min-width: 0; }
.dc-n { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 21px; line-height: 1.1; }
.dc-s { font-size: 14.5px; color: var(--muted); line-height: 1.3; }
.dc-pr { grid-area: pr; display: flex; align-items: center; gap: 10px; }
.dc-pr .bar { flex: 1; height: 9px; background: #eef0f3; border-radius: 9px; overflow: hidden; }
.dc-pr .bar i { display: block; height: 100%; background: var(--c); border-radius: 9px; }
.dc-st { font-size: 15px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.dc-st .ic.on { fill: #f2b705; stroke: #d39b00; }
.row2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-top: 14px; }
.tile { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left; background: #fff; border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; box-shadow: var(--sh); min-height: 96px; }
.tile .ic { width: 28px; height: 28px; color: var(--pp); }
.tile b { font-family: 'Bricolage Grotesque', sans-serif; font-size: 19px; font-weight: 800; }
.tile span { font-size: 15px; color: var(--muted); }
.tile.warm { background: var(--mid-l); border-color: #f1d98a; }
.tile.warm .ic { color: var(--mid); }
.foot-links { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; }
.ver { color: #9aa1aa; font-size: 13px; }

/* ---------- destino ---------- */
.dhead { display: flex; gap: 14px; align-items: center; background: var(--cl); border-radius: var(--r); padding: 14px 16px; border-left: 6px solid var(--c); }
.dh-ic { width: 54px; height: 54px; border-radius: 50%; background: #fff; color: var(--cd); display: grid; place-items: center; flex: none; }
.dh-ic .ic { width: 30px; height: 30px; }
.dhead b { display: block; font-size: 18px; }
.dhead span { font-size: 15.5px; color: var(--muted); }
.rlist { display: grid; gap: 10px; margin-top: 14px; }
.rcard { display: flex; align-items: center; gap: 14px; text-align: left; background: #fff; border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; box-shadow: var(--sh); min-height: 78px; }
.rc-n { width: 40px; height: 40px; border-radius: 50%; background: var(--c); color: #fff; font-weight: 800; display: grid; place-items: center; flex: none; font-family: 'Bricolage Grotesque', sans-serif; font-size: 19px; }
.rc-tx { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.rc-tx b { font-family: 'Bricolage Grotesque', sans-serif; font-size: 20px; font-weight: 800; }
.rc-tx span { font-size: 15.5px; color: var(--muted); }
.rc-st { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.rc-st small { font-size: 13px; color: var(--muted); }
.stars { display: inline-flex; gap: 2px; }
.stars .ic { width: 22px; height: 22px; }
.stars .ic.on { fill: #f2b705; stroke: #d39b00; }
.stars .ic.off { fill: #e9ecef; stroke: #cfd4da; }
.stars.big .ic { width: 56px; height: 56px; }
.stars.big .ic.on { animation: pop .5s cubic-bezier(.2,1.6,.4,1) both; }
.stars.big .ic:nth-child(2) { animation-delay: .15s; } .stars.big .ic:nth-child(3) { animation-delay: .3s; }
@keyframes pop { 0% { transform: scale(0); } 100% { transform: scale(1); } }

/* ---------- preguntas ---------- */
h1.q { font-size: 24px; font-weight: 700; line-height: 1.25; margin: 2px 0 14px; }
h1.q b { color: var(--cd); }
.sub { color: var(--muted); font-size: 16.5px; margin: -6px 0 12px; }
.sub .ic { color: var(--cd); }
.quote { background: #fff; border: 1px solid var(--line); border-left: 6px solid var(--c); border-radius: 12px; padding: 16px 18px; font-size: 21.5px; line-height: 1.5; margin: 0 0 16px; box-shadow: var(--sh); }
.quote b { background: var(--cl); color: var(--cd); padding: 0 4px; border-radius: 4px; }
.opts { display: grid; gap: 10px; }
.opts.two { grid-template-columns: 1fr 1fr; }
.opts.grid, .opts.two-col { grid-template-columns: 1fr 1fr; }
.opts.short { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.opt { min-height: 58px; background: #fff; border: 2px solid var(--line); border-radius: 14px; text-align: left; padding: 12px 16px; display: flex; align-items: center; gap: 10px; font-size: 19px; line-height: 1.3; box-shadow: var(--sh); }
.opts.big .opt { font-size: 22px; justify-content: center; text-align: center; min-height: 70px; }
.opt.right { border-color: var(--ok); background: var(--ok-l); color: var(--ok-d); font-weight: 700; }
.opt.wrong { border-color: var(--ko); background: var(--ko-l); color: var(--ko-d); }
.opt.dim { opacity: .5; }
.opt .oi { width: 24px; height: 24px; }
.opt:disabled { cursor: default; }
@media (hover: hover) { .opt:not(:disabled):hover { border-color: var(--c); } }
.opt:not(:disabled):active { transform: scale(.98); }
.tipbox { display: flex; gap: 12px; margin-top: 16px; background: var(--mid-l); border: 1px solid #f1d98a; border-radius: 14px; padding: 14px 16px; font-size: 17.5px; }
.tipbox .ic { color: var(--mid); width: 26px; height: 26px; }
.fb { margin-top: 16px; background: #fff; border-radius: 14px; border: 1px solid var(--line); border-left: 7px solid var(--ok); padding: 14px 16px; box-shadow: var(--sh); font-size: 17.5px; }
.fb.ko { border-left-color: var(--ko); } .fb.mid { border-left-color: var(--mid); }
.fb-h { display: flex; align-items: center; gap: 10px; font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; }
.fb-h .ic { width: 28px; height: 28px; color: var(--ok); }
.fb.ko .fb-h .ic { color: var(--ko); } .fb.mid .fb-h .ic { color: var(--mid); }
.fb-p { margin-left: auto; font-size: 18px; color: var(--muted); }
.fb p { margin: 8px 0 0; }
.fb .ans { font-weight: 400; }
.hl { background: #ffd84d; padding: 0 6px; border-radius: 6px; }

/* ordenar */
.ocards { display: grid; gap: 10px; }
.ocard { display: flex; align-items: center; gap: 14px; text-align: left; background: #fff; border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; min-height: 64px; font-size: 18.5px; line-height: 1.35; box-shadow: var(--sh); width: 100%; }
.ocard .on-n { width: 40px; height: 40px; border-radius: 50%; border: 2.5px dashed #c3cad4; display: grid; place-items: center; flex: none; font-weight: 800; font-family: 'Bricolage Grotesque', sans-serif; font-size: 20px; color: #fff; }
.ocard.on { border-color: var(--c); background: var(--cl); }
.ocard.on .on-n, .ocard.res .on-n { border: 0; background: var(--cd); }
.ocard .on-t { flex: 1; }
.ocard .lab { display: inline-block; margin-left: 8px; font-size: 14px; font-weight: 700; color: var(--cd); background: var(--cl); padding: 1px 8px; border-radius: 999px; }
.ocard.res.right { border-color: var(--ok); } .ocard.res.wrong { border-color: var(--ko); background: #fff8f7; }
.ocard .on-you { font-size: 14px; color: var(--ko-d); white-space: nowrap; }
.ocard.res.right .on-you { color: var(--ok); }

/* clasificar */
.bank { display: flex; flex-wrap: wrap; gap: 10px; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin-bottom: 14px; min-height: 74px; align-items: center; }
.chip { min-height: 50px; padding: 6px 18px; border-radius: 999px; background: #fff; border: 2px solid #c9d0d9; font-weight: 700; font-size: 18.5px; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.15; }
.chip.sel { background: var(--cd); border-color: var(--cd); color: #fff; transform: translateY(-2px); box-shadow: 0 6px 14px rgba(0,0,0,.15); }
.chip.right { border-color: var(--ok); background: var(--ok-l); color: var(--ok-d); }
.chip.wrong { border-color: var(--ko); background: var(--ko-l); color: var(--ko-d); }
.chip small { font-size: 13px; font-weight: 400; }
.bins { display: grid; gap: 10px; }
.bins.n2 { grid-template-columns: 1fr 1fr; } .bins.n3 { grid-template-columns: repeat(3, 1fr); }
.bin { background: var(--cl); border: 2.5px dashed var(--c); border-radius: 14px; padding: 10px; min-height: 150px; }
.bin.armed { border-style: solid; box-shadow: 0 0 0 4px rgba(255,255,255,.9), 0 0 0 7px var(--c); }
.bin-h { font-weight: 800; color: var(--cd); font-size: 16.5px; line-height: 1.2; margin-bottom: 8px; text-align: center; }
.bin-c { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.bin-e { color: var(--muted); font-size: 14.5px; text-align: center; padding: 8px; }

/* mayúsculas */
.capbox { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; font-size: 22px; line-height: 2.05; box-shadow: var(--sh); }
.cl { margin-bottom: 4px; }
.tk { background: none; border: 0; padding: 4px 3px; border-radius: 7px; font-size: inherit; line-height: 1.45; min-height: 44px; }
.tk.up, .tk.hit { color: var(--ok-d); background: #d9f5e3; font-weight: 800; }
.tk.miss { color: #a24d06; background: #fff1e0; box-shadow: inset 0 0 0 2px #ef7b1a; font-weight: 800; }
.tk.bad { color: var(--ko-d); background: var(--ko-l); text-decoration: line-through; text-decoration-thickness: 2px; }
.tk.trap { box-shadow: inset 0 -3px 0 #8fb5e8; }
.tk.fixed { padding: 0; }
.tk:disabled { cursor: default; color: inherit; }
.tk.hit:disabled { color: var(--ok-d); } .tk.miss:disabled { color: #a24d06; } .tk.bad:disabled { color: var(--ko-d); }
.caprep { list-style: none; padding: 0; margin: 8px 0 0; display: grid; grid-template-columns: 1fr 1fr; gap: 4px 16px; font-size: 16px; }
.caprep li { display: flex; gap: 6px; align-items: baseline; line-height: 1.3; }
.caprep li .ic { width: 18px; height: 18px; color: var(--ok); align-self: center; }
.caprep li.m .ic { color: var(--ko); }
.caprep li b { white-space: nowrap; }
.caprep li span { color: var(--muted); }

/* mapa */
.mapbox { background: #e6f1f8; border-radius: 16px; border: 1px solid var(--line); overflow: hidden; display: flex; justify-content: center; box-shadow: var(--sh); margin-bottom: 14px; }
.mapbox svg { width: 100%; height: auto; max-height: max(270px, calc(100dvh - 330px)); display: block; }
.mapbox.name svg { max-height: max(250px, calc(100dvh - 400px)); }
.mapside .fb { margin-top: 0; }
.mapside .tipbox { margin-top: 0; margin-bottom: 12px; }
.mapside .opts + .tipbox, .mapside .opts + .fb { margin-top: 12px; }
@media (orientation: landscape) and (min-width: 900px) {
  .wrap:has(.mapwrap) { max-width: 1080px; }
  .mapwrap { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  .mapwrap .mapbox { margin-bottom: 0; }
  .mapwrap .mapbox svg, .mapwrap .mapbox.name svg { max-height: max(300px, calc(100dvh - 230px)); }
  .mapwrap .opts.two-col { grid-template-columns: 1fr; }
}
.ocards.compact { gap: 8px; }
.ocards.compact .ocard { min-height: 52px; padding: 8px 12px; font-size: 17.5px; }
.ocards.compact .on-n { width: 34px; height: 34px; font-size: 18px; }
.mapa .mar { fill: #e6f1f8; }
.mapa .ctx { fill: #f3f1ec; stroke: #d6d3cc; stroke-width: .8; }
.mapa .z path, .mapa .nz path { fill: #ece5d6; stroke: #fff; stroke-width: 1.1; }
.mapa .z { cursor: pointer; }
.mapa .lim { fill: none; stroke: #fff; stroke-width: 1.1; pointer-events: none; }
.mapa .costa { fill: none; stroke: #8a8478; stroke-width: 1; pointer-events: none; }
.mapa .inset { fill: #f8f5ef; stroke: #9a948a; }
.mapa .lbl { font: italic 15px 'Atkinson Hyperlegible Next', sans-serif; fill: #6b7a88; text-anchor: middle; pointer-events: none; }
.mapa .lbl.pais { font-style: normal; font-weight: 700; letter-spacing: .12em; fill: #a3a097; }
.mapa .hit, .mapa .hitbox { fill: transparent; }
.mapa .dot { fill: #2F6FE0; stroke: #fff; stroke-width: 2; opacity: 0; }
.mapa .z.tgt path { fill: #ffd84d; stroke: #1b1f24; stroke-width: 2.4; animation: tgt 1.2s ease-in-out infinite alternate; }
.mapa .z.pt.tgt .hit { fill: rgba(255,216,77,.75); stroke: #1b1f24; stroke-width: 2.4; animation: tgt 1.2s ease-in-out infinite alternate; }
.mapa .z.pt.tgt .dot { opacity: 1; fill: #1b1f24; }
.mapa .z.tgt .hitbox { fill: rgba(255,216,77,.35); }
@keyframes tgt { from { opacity: 1; } to { opacity: .65; } }
.mapa .z.rev path { stroke: #fff; }
.mapa .z.rev[data-z=gal] path { fill: #6C5BC7; }
.mapa .z.rev[data-z=ast] path { fill: url(#rayas-ast); stroke: #3D9BE0; }
.mapa .z.rev[data-z=ara] path { fill: url(#rayas-ara); stroke: #E0484D; }
.mapa .z.rev[data-z=eus] path { fill: #2E9E5B; }
.mapa .z.rev[data-z=eus] path:nth-of-type(2) { fill: #9ED8B2; }
.mapa .z.rev[data-z=cat] path { fill: #F08A24; }
.mapa .z.rev[data-z=val] path { fill: #F7B267; }
.mapa .z.rev[data-z=cas] path { fill: #d5c6a6; }
.mapa .z.pt.rev .dot { opacity: 1; }
.mapa .z.pt.rev .hit { fill: rgba(47,111,224,.22); }
.mapa .z.rev[data-z=and] path { fill: #E9A23B; }
.mapa .z.rev[data-z=ext] path { fill: #5DA97A; }
.mapa .z.rev[data-z=mur] path { fill: #D96C9F; }
.mapa .z.rev[data-z=can] path { fill: #4FA3D1; }
.mapa .z.bad path { fill: #f6b9b4; }
.mapa .z.pt.bad .hit { fill: rgba(209,69,59,.35); }
.mapa .tapmark { stroke: #fff; stroke-width: 3; }
.mapa .tapmark.ok { fill: var(--ok); } .mapa .tapmark.ko { fill: var(--ko); }

/* ---------- resultado ---------- */
.result { text-align: center; background: #fff; border-radius: 20px; padding: 22px 18px; box-shadow: var(--sh); border: 1px solid var(--line); }
.pct, .nota { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 58px; line-height: 1; margin-top: 8px; color: var(--cd); }
.nota span { font-size: 26px; color: var(--muted); margin-left: 4px; }
.rmsg { font-size: 28px; font-weight: 800; margin: 10px 0 2px; }
.rsub { color: var(--muted); margin: 6px 0 0; }
.rsub .ic { color: #ef7b1a; }
.perdest { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 14px; }
.pd { background: var(--cl); color: var(--cd); border-radius: 12px; padding: 8px 6px; display: flex; flex-direction: column; align-items: center; font-size: 14px; }
.pd .ic { width: 24px; height: 24px; }
.pd span { font-weight: 800; font-size: 18px; }
.newstamp { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-bottom: 8px; }
.newstamp .stamp { width: 120px; }
.newstamp b { font-family: 'Bricolage Grotesque', sans-serif; font-size: 21px; color: var(--cd); }
.bigic { width: 64px; height: 64px; color: var(--cd); }
.fails { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.fails li { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; display: flex; flex-direction: column; gap: 4px; font-size: 16.5px; }
.fails .fq { color: var(--muted); }
.fails .fa { color: var(--ok-d); font-weight: 700; }
.fails .fa .ic { width: 18px; height: 18px; }
.fails .fn { font-size: 13px; color: var(--ko-d); }

/* ---------- tarjetas ---------- */
.fcard { background: #fff; border-radius: 22px; border: 1px solid var(--line); border-top: 9px solid var(--c); padding: 22px 20px; min-height: 320px; display: flex; flex-direction: column; gap: 18px; box-shadow: 0 10px 28px rgba(27,31,36,.08); }
.fc-k { font-size: 15px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.fc-k .ic { color: var(--cd); }
.fc-q { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 30px; line-height: 1.15; text-align: center; margin: auto 0; }
.fc-a { background: var(--cl); border-radius: 14px; padding: 16px 18px; font-size: 21px; line-height: 1.45; animation: fadein .35s ease both; }
.fc-hint { text-align: center; color: var(--muted); font-size: 16px; }
@keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ---------- ayuda y familia ---------- */
.help { background: #fff; border-radius: 18px; padding: 16px 18px; border: 1px solid var(--line); }
.help p { margin: 0 0 12px; }
.help .ic { color: var(--cd); }
.fam .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.fam .kpis div { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 12px; text-align: center; display: flex; flex-direction: column; }
.fam .kpis b { font-family: 'Bricolage Grotesque', sans-serif; font-size: 28px; color: var(--cd); }
.fam .kpis span { font-size: 13.5px; color: var(--muted); line-height: 1.2; }
.ftab { width: 100%; border-collapse: collapse; background: #fff; border-radius: 14px; overflow: hidden; font-size: 16px; }
.ftab td, .ftab th { padding: 8px 12px; border-bottom: 1px solid var(--line); text-align: left; }
.ftab tr.dr th { background: var(--cl); color: var(--cd); font-size: 16.5px; }
.ftab .stars .ic { width: 18px; height: 18px; }

/* ---------- hoja inferior y avisos ---------- */
#sheet { position: fixed; inset: 0; display: none; z-index: 20; }
#sheet.on { display: block; }
.sh-bg { position: absolute; inset: 0; background: rgba(15,18,22,.45); }
.sh-card { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); width: min(620px, 100%); background: #fff; border-radius: 22px 22px 0 0; padding: 20px 20px max(20px, env(safe-area-inset-bottom)); animation: up .25s ease both; }
.sh-card h2 { margin: 0 0 6px; font-size: 24px; }
.sh-card p { margin: 0 0 16px; color: var(--muted); }
.sh-btns { display: flex; gap: 10px; }
.sh-btns .btn { flex: 1; }
@keyframes up { from { transform: translate(-50%, 30px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
#toast { position: fixed; left: 50%; bottom: calc(100px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px); background: #1b1f24; color: #fff; padding: 12px 20px; border-radius: 999px; font-size: 16px; opacity: 0; pointer-events: none; transition: .25s; z-index: 30; max-width: 90%; text-align: center; }
#toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ---------- pantallas estrechas (iPhone) ---------- */
@media (max-width: 600px) {
  body { font-size: 18px; }
  .dgrid { grid-template-columns: 1fr; }
  .opts.two, .opts.grid, .opts.two-col { grid-template-columns: 1fr; }
  .bins.n3 { grid-template-columns: 1fr; }
  .caprep { grid-template-columns: 1fr; }
  .pp-stamps { gap: 6px; padding: 8px; }
  .fam .kpis, .perdest { grid-template-columns: 1fr 1fr; }
  .prog { display: none; }
  .btn { padding: 0 14px; font-size: 17px; }
  .btn.ico { flex: none; width: 56px; padding: 0; }
  .btn.ico .t { display: none; }
  .stamp .st-in span { display: none; }
  .stamp .st-in .ic { width: 24px; height: 24px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ---------- problemas numéricos ---------- */
.fchosen { display: flex; gap: 10px; align-items: center; border-radius: 12px; padding: 10px 14px; margin: 0 0 12px; font-size: 17px; background: var(--ok-l); color: var(--ok-d); }
.fchosen.ko { background: var(--ko-l); color: var(--ko-d); }
.fchosen .ic { width: 22px; height: 22px; }
.opt.fopt { justify-content: center; font-size: 22px; font-weight: 700; font-family: 'Bricolage Grotesque', sans-serif; }
.numbox { display: flex; align-items: center; gap: 12px; background: #fff; border: 3px solid var(--c); border-radius: 16px; padding: 10px 18px; min-height: 72px; margin: 0 0 14px; box-shadow: var(--sh); }
.numbox .nv { flex: 1; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 36px; text-align: right; letter-spacing: .02em; min-height: 1.2em; }
.numbox .nu { font-size: 22px; font-weight: 700; color: var(--muted); min-width: 60px; }
.numbox .caret { display: inline-block; width: 3px; height: 1em; background: var(--c); margin-left: 3px; vertical-align: -.12em; animation: blink 1s steps(1) infinite; }
.numbox.right { border-color: var(--ok); background: var(--ok-l); } .numbox.wrong { border-color: var(--ko); background: var(--ko-l); }
.numbox.right .caret, .numbox.wrong .caret { display: none; }
@keyframes blink { 50% { opacity: 0; } }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr) 1.1fr; grid-template-areas: 'a b c d' 'e f g d' 'h i j d' 'k l m d'; gap: 8px; max-width: 460px; margin: 0 auto; }
.key { min-height: 60px; border-radius: 14px; border: 2px solid var(--line); background: #fff; font-size: 26px; font-weight: 700; font-family: 'Bricolage Grotesque', sans-serif; box-shadow: var(--sh); }
.key:active { background: var(--cl); transform: scale(.97); }
.key.del { grid-area: d; background: #f1f3f5; }
.key.del .ic { width: 30px; height: 30px; }
.fb .steps { background: var(--cl); border-radius: 10px; padding: 10px 12px; font-family: 'Atkinson Hyperlegible Next', sans-serif; line-height: 1.6; }
@media (orientation: landscape) and (min-width: 900px) and (max-height: 860px) {
  .key { min-height: 50px; font-size: 23px; }
  .numbox { min-height: 60px; padding: 6px 16px; }
  .numbox .nv { font-size: 30px; }
}

/* ---------- teoría ---------- */
.rcard.learn { border: 2px solid var(--c); background: var(--cl); }
.rcard.learn .rc-n { background: var(--cd); }
.rcard.learn .rc-n .ic { width: 22px; height: 22px; }
.okic { width: 26px; height: 26px; color: var(--ok); }
.lesson .figbox { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 12px; margin: 0 0 14px; display: flex; justify-content: center; box-shadow: var(--sh); }
.lesson .fig { width: 100%; max-width: 520px; height: auto; max-height: 34dvh; }
.len, .les { display: flex; gap: 12px; border-radius: 14px; padding: 14px 16px; margin: 0 0 12px; line-height: 1.55; }
.len { background: #fff; border: 1px solid var(--line); border-left: 6px solid var(--c); font-size: 19.5px; }
.les { background: var(--cl); font-size: 18px; }
.len .tag, .les .tag { flex: none; font-weight: 800; font-size: 13px; letter-spacing: .06em; color: #fff; background: var(--cd); border-radius: 6px; padding: 2px 6px; height: fit-content; margin-top: 3px; }
.les .tag { background: #5b6470; }
.lcheck { background: #fff; border: 2px dashed var(--c); border-radius: 16px; padding: 14px; margin-top: 4px; }

const ITEMS = [];
function fx(id, q, x, opts, a, w, extra) { ITEMS.push(Object.assign({ id, t: 'ch', q, x, o: opts, a, fixed: true, w }, extra || {})); }
function ch(id, q, x, opts, w, extra) { ITEMS.push(Object.assign({ id, t: 'ch', q, x, o: opts, a: 0, fixed: false, w }, extra || {})); }

const pickN = a => a[Math.floor(Math.random() * a.length)];

const nf = (n, d = 2) => { const s = (Math.round(n * 10 ** d) / 10 ** d).toFixed(d).replace(/\.?0+$/, ''); return s === '-0' ? '0' : s.replace('-', '−'); };
const FD = ['d = m / V', 'm = d · V', 'V = m / d', 'd = V / m'];
const FG = ['p₁ · V₁ = p₂ · V₂', 'V₁ / T₁ = V₂ / T₂', 'p₁ / T₁ = p₂ / T₂', 'd = m / V'];
/* num: problema numérico. f = opciones de fórmula (la 1.ª es la buena) o null */
function num(id, gen, extra) { ITEMS.push(Object.assign({ id, t: 'num', gen }, extra || {})); }

/* =================== GENERADORES DE PROBLEMAS =================== */
const MATS = [['aluminium', 2.7], ['iron', 7.9], ['gold', 19.3], ['copper', 8.9], ['glass', 2.5], ['oil', 0.92], ['mercury', 13.6], ['silver', 10.5], ['cork', 0.24], ['lead', 11.3]];
const GEN = {
  // densidad: d = m / V
  dD() {
    const [mat, d] = pickN(MATS), V = rint(4, 60) * 5, m = r1(d * V);
    return { q: 'Calculate the density.', x: `A piece of ${mat} has a mass of <b>${nf(m, 1)} g</b> and a volume of <b>${V} cm³</b>.`, ans: m / V, unit: 'g/cm³', f: [FD[0], FD[1], FD[2], FD[3]],
      steps: `d = m / V = ${nf(m, 1)} g / ${V} cm³ = <b>${nf(m / V, 2)} g/cm³</b>` };
  },
  dM() {
    const [mat, d] = pickN(MATS), V = rint(2, 40) * 5;
    return { q: 'Calculate the mass.', x: `The density of ${mat} is <b>${nf(d)} g/cm³</b>. What is the mass of <b>${V} cm³</b> of ${mat}?`, ans: d * V, unit: 'g', f: [FD[1], FD[0], FD[2], FD[3]],

  },
  dV() {
    const [mat, d] = pickN(MATS), m = rint(2, 60) * 10;

      steps: `V = m / d = ${m} g / ${nf(d)} g/cm³ = <b>${nf(m / d, 2)} cm³</b>` };
  },
  dGL() {
    const V = rint(2, 20) * 25, d = pickN([0.8, 0.92, 1.2, 1.5, 2.7, 3.4]), m = r1(d * V);
    return { q: 'Calculate the density in g/L.', x: `A liquid has a mass of <b>${nf(m, 1)} g</b> and a volume of <b>${V} mL</b>. Express the result in <b>g/L</b>.`, ans: m / V * 1000, unit: 'g/L', f: [FD[0], FD[1], FD[2], FD[3]],
      steps: `${V} mL = ${nf(V / 1000, 3)} L → d = ${nf(m, 1)} g / ${nf(V / 1000, 3)} L = <b>${nf(m / V * 1000, 1)} g/L</b><br><small>Truco: g/mL × 1000 = g/L.</small>` };
  },
  dDisp() {
    const a = rint(10, 20) * 10, dv = rint(4, 30), d = pickN([2.5, 2.7, 7.9, 1.8, 3]), m = r1(d * dv);
    return { q: 'Water displacement: calculate the density.', x: `A graduated cylinder contains <b>${a} mL</b> of water. We put in a stone of <b>${nf(m, 1)} g</b> and the water level rises to <b>${a + dv} mL</b>.`, ans: m / dv, unit: 'g/mL', f: [FD[0], FD[1], FD[2], FD[3]],
      steps: `V = ${a + dv} − ${a} = ${dv} mL → d = ${nf(m, 1)} g / ${dv} mL = <b>${nf(m / dv, 2)} g/mL</b>` };
  },
  // conversiones
  cK() { const c = pickN([-40, -20, -5, 0, 15, 22, 25, 37, 50, 80, 100, 150]); return { q: 'Convert to kelvin.', x: `<b>${nf(c)} °C</b> = ? K`, ans: c + 273, unit: 'K', abs: 0.6, steps: `K = °C + 273 = ${nf(c)} + 273 = <b>${c + 273} K</b>` }; },
  cC() { const k = pickN([0, 25, 100, 200, 250, 273, 300, 310, 350, 373, 400]); return { q: 'Convert to degrees Celsius.', x: `<b>${k} K</b> = ? °C`, ans: k - 273, unit: '°C', abs: 0.6, steps: `°C = K − 273 = ${k} − 273 = <b>${nf(k - 273)} °C</b>` }; },
  cPa() { const p = pickN([0.5, 1, 1.5, 2, 2.5, 3, 0.2]); return { q: 'Convert to pascals.', x: `<b>${nf(p)} atm</b> = ? Pa`, ans: p * 101325, unit: 'Pa', steps: `1 atm = 101325 Pa → ${nf(p)} · 101325 = <b>${nf(p * 101325, 1)} Pa</b>` }; },
  cAtm() { const pa = pickN([202650, 50662.5, 303975, 151987.5, 101325]); return { q: 'Convert to atmospheres.', x: `<b>${nf(pa, 1)} Pa</b> = ? atm`, ans: pa / 101325, unit: 'atm', steps: `atm = Pa / 101325 = ${nf(pa, 1)} / 101325 = <b>${nf(pa / 101325, 2)} atm</b>` }; },
  cL() { const ml = pickN([250, 500, 750, 1500, 2000, 330, 125]); return { q: 'Convert to litres.', x: `<b>${ml} mL</b> = ? L`, ans: ml / 1000, unit: 'L', steps: `1 L = 1000 mL → ${ml} / 1000 = <b>${nf(ml / 1000, 3)} L</b>` }; },
  cG() { const kg = pickN([0.5, 1.2, 2, 0.25, 3.5, 0.75]); return { q: 'Convert to grams.', x: `<b>${nf(kg)} kg</b> = ? g`, ans: kg * 1000, unit: 'g', steps: `1 kg = 1000 g → ${nf(kg)} · 1000 = <b>${nf(kg * 1000)} g</b>` }; },
  // leyes de los gases (T en K = °C + 273, como en clase)
  gB() {
    const [p1, V1, p2] = pickN([[1, 6, 2], [2, 3, 1], [1.5, 4, 3], [1, 10, 4], [3, 2, 1.5], [1.2, 5, 2], [0.8, 9, 1.2], [2.5, 2, 1]]);
    return { q: 'Constant temperature. Calculate the final volume.', x: `A gas occupies <b>${nf(V1)} L</b> at <b>${nf(p1)} atm</b>. The pressure changes to <b>${nf(p2)} atm</b> at constant temperature.`, ans: p1 * V1 / p2, unit: 'L', f: [FG[0], FG[1], FG[2], FG[3]],
      steps: `Boyle-Mariotte: p₁·V₁ = p₂·V₂ → V₂ = p₁·V₁ / p₂ = ${nf(p1)} · ${nf(V1)} / ${nf(p2)} = <b>${nf(p1 * V1 / p2)} L</b>` };
  },

      steps: `p₂ = p₁·V₁ / V₂ = ${nf(p1)} · ${nf(V1)} / ${nf(V2)} = <b>${nf(p1 * V1 / V2)} atm</b>` };
  },
  gC() {
    const [V1, c1, c2] = pickN([[3, 20, 40], [2, 27, 127], [5, 0, 50], [4, 17, 77], [1.5, 7, 63], [6, 100, 0]]);
    const T1 = c1 + 273, T2 = c2 + 273;
    return { q: 'Constant pressure. Calculate the final volume.', x: `A balloon has a volume of <b>${nf(V1)} L</b> at <b>${c1} °C</b>. It is ${c2 > c1 ? 'heated' : 'cooled'} to <b>${c2} °C</b> at constant pressure.`, ans: V1 * T2 / T1, unit: 'L', f: [FG[1], FG[0], FG[2], FG[3]],
      steps: `Charles: T in kelvin! T₁ = ${c1} + 273 = ${T1} K; T₂ = ${c2} + 273 = ${T2} K.<br>V₂ = V₁·T₂ / T₁ = ${nf(V1)} · ${T2} / ${T1} = <b>${nf(V1 * T2 / T1)} L</b>` };
  },
  gG() {
    const [p1, c1, c2] = pickN([[1, 20, 40], [2, 27, 127], [1.5, 0, 100], [3, 50, 100], [1, 7, 147], [4, 127, 27]]);
    const T1 = c1 + 273, T2 = c2 + 273;
    return { q: 'Constant volume. Calculate the final pressure.', x: `A closed container has a gas at <b>${nf(p1)} atm</b> and <b>${c1} °C</b>. It is ${c2 > c1 ? 'heated' : 'cooled'} to <b>${c2} °C</b>.`, ans: p1 * T2 / T1, unit: 'atm', f: [FG[2], FG[0], FG[1], FG[3]],
      steps: `Gay-Lussac: T₁ = ${T1} K; T₂ = ${T2} K.<br>p₂ = p₁·T₂ / T₁ = ${nf(p1)} · ${T2} / ${T1} = <b>${nf(p1 * T2 / T1)} atm</b>` };
  },
  gGT() {
    const [p1, c1, p2] = pickN([[1, 27, 2], [2, 127, 1], [1, 0, 1.5], [3, 27, 4]]);
    const T1 = c1 + 273, T2 = T1 * p2 / p1;
    return { q: 'Constant volume. Calculate the final temperature in °C.', x: `A gas at <b>${nf(p1)} atm</b> and <b>${c1} °C</b> is kept at constant volume until its pressure is <b>${nf(p2)} atm</b>.`, ans: T2 - 273, unit: '°C', abs: 1.5, f: [FG[2], FG[0], FG[1], FG[3]],
      steps: `T₁ = ${T1} K → T₂ = T₁·p₂ / p₁ = ${T1} · ${nf(p2)} / ${nf(p1)} = ${nf(T2, 1)} K → <b>${nf(T2 - 273, 1)} °C</b>` };
  }
};

for (const i of ITEMS) if (!ITEM_DEST[i.id]) ITEM_DEST[i.id] = i.id.startsWith('hs') ? 'd3' : (i.id.startsWith('ps') ? 'd4' : 'd1');

function fresh() { return { v: 1, retos: {}, err: {}, seen: {}, flash: {}, mision: { last: '', streak: 0, n: 0 }, aduana: { best: null, last: null, runs: 0 }, stamps: {}, learn: {}, created: Date.now(), updated: 0 }; }

  } catch (e) { storageOk = false; }

}

function recordItem(id, score) {
  S.seen[id] = (S.seen[id] || 0) + 1;
  if (score < 0.999) S.err[id] = Math.min(9, (S.err[id] || 0) + 1);
  else if (S.err[id]) { S.err[id]--; if (!S.err[id]) delete S.err[id]; }
}
const starsFor = pct => pct >= 0.9 ? 3 : pct >= 0.7 ? 2 : pct >= 0.5 ? 1 : 0;
const retoBest = id => (S.retos[id] && S.retos[id].best) || 0;
const destStars = d => DEST[d].retos.reduce((a, r) => a + retoBest(r.id), 0);
const destMax = d => DEST[d].retos.length * 3;

/* ---------------- preparar rondas ---------------- */
function priority(list) {
  // primero lo que ha fallado, después lo menos visto; desempate al azar
  return shuffle(list).sort((a, b) => ((S.err[b.id] || 0) - (S.err[a.id] || 0)) || ((S.seen[a.id] || 0) - (S.seen[b.id] || 0)));
}
function takeFrom(list, n) {
  const pr = priority(list);
  const errs = pr.filter(i => S.err[i.id]).slice(0, Math.ceil(n / 2));
  const rest = pr.filter(i => !errs.includes(i));
  return errs.concat(rest).slice(0, n);
}
function inst(item) {
  const x = { item, done: false, score: 0 };
  if (item.t === 'ch') {
    const idx = item.o.map((_, k) => k);
    x.order = item.fixed ? idx : shuffle(idx);
  } else if (item.t === 'ord') {
    let pos = item.s.map((_, k) => k);
    if (item.pick) pos = shuffle(pos).slice(0, item.pick).sort((a, b) => a - b);
    x.pos = pos; x.show = shuffle(pos); x.num = {};
  } else if (item.t === 'cls') {
    x.bank = shuffle(item.ch.map((_, k) => k)); x.place = {}; x.sel = null;
  } else if (item.t === 'cap') {
    x.lines = parseCaps(item.src); x.on = {};
  } else if (item.t === 'num') {
    x.p = item.gen ? GEN[item.gen]() : { q: item.q, x: item.x, ans: item.ans, unit: item.unit, f: item.f, steps: item.steps, abs: item.abs };
    x.val = ''; x.fdone = !x.p.f; x.fok = null;
    if (x.p.f) x.forder = shuffle(x.p.f.map((_, k) => k));
  } else if (item.t === 'map') {
    if (item.mode === 'name') {
      // sin opciones que también serían verdad: el castellano se habla en todas las zonas,
      // y el aranés está dentro de Cataluña
      const no = { cat: ['arn'], arn: ['cat'] }[item.z] || [];
      const zs = Object.keys(ZONAS[item.m]).filter(z => z !== item.z && (z !== 'cas' || item.z === 'cas') && !no.includes(z));
      x.opts = shuffle([item.z].concat(shuffle(zs).slice(0, 3)));
    }
  }
  return x;
}
function buildReto(r) {
  let out = [];
  for (const p of r.parts) out = out.concat(takeFrom(pool(p.p, p.only), p.n));
  if (r.mix) out = shuffle(out);
  return out.map(inst);
}
function buildMision() {
  const of = (d, t) => ITEMS.filter(i => ITEM_DEST[i.id] === d && i.t === t);
  let out = shuffle([].concat(takeFrom(of('d1', 'ch'), 2), takeFrom(of('d2', 'ch'), 1), takeFrom(of('d3', 'ch'), 2), takeFrom(of('d4', 'ch'), 2)));
  out = out.concat(takeFrom(of('d2', 'num'), 1), takeFrom(of('d3', 'num'), 1), takeFrom(of('d4', 'num'), 1));
  return out.map(inst);
}
function buildAduana() {
  const g = (prefix, n, only) => takeFrom(pool(prefix, only), n);
  const out = [].concat(
    g('mt', 1), g('gs', 1, 'ch'), g('un', 2),
    g('db', 2), g('dg', 2), g('dw', 1, 'num'),
    g('sl', 1, 'ch'), g('cs', 1), g('mp', 1), g('kt', 1), g('cv', 1),
    g('wl', 2), g('wh', 1), g('gg', 2), g('gw', 1, 'num'));
  return out.map(inst);
}
function buildFallos() {
  const list = Object.keys(S.err).filter(id => IT[id]).map(id => IT[id]);
  return priority(list).slice(0, 10).map(inst);
}

/* ---------------- mayúsculas: lectura de los textos marcados ---------------- */
function parseCaps(src) {
  return src.split('\n').map(line => line.split(' ').filter(Boolean).map(tok => {
    const m = tok.match(/^([¡¿«“(]*)([A-Za-zÁÉÍÓÚÜÑáéíóúüñ]+)(?:\^([A-Z0-9]+)|~([a-z]+))?(.*)$/);
    if (!m) return { pre: '', word: '', post: tok, fixed: true };
    const [, pre, word, code, trap, post] = m;
    return { pre, word, post, up: word[0] !== word[0].toLowerCase(), code: code || null, trap: trap || null };
  }));
}
const capWord = w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase();

/* --- problema numérico: fórmula + teclado propio --- */
const numVal = v => { if (!v || v === '−' || v === '.') return null; const n = Number(v.replace('−', '-').replace(',', '.')); return isFinite(n) ? n : null; };
const numOk = (x, v) => { const p = x.p, tol = p.abs != null ? p.abs : Math.max(Math.abs(p.ans) * 0.015, 1e-9); return v !== null && Math.abs(v - p.ans) <= tol; };

  }

function tipFor(it) {

/* --- clasificar --- */
function rClassify(x) {
  const it = x.item;
  const chip = k => {

    return `<button class="chip ${cls}" data-act="chip" data-k="${k}" ${x.done ? 'disabled' : ''}>${esc(it.ch[k][0])}${x.done && x.place[k] !== it.ch[k][1] ? `<small>→ ${esc(it.bins[it.ch[k][1]])}</small>` : ''}</button>`;

/* --- corrección --- */
const PRAISE = ['¡Bien!', '¡Exacto!', '¡Eso es!', '¡Muy bien!', '¡Perfecto!', '¡Genial!'];

  recordItem(x.item.id, score);

}

  else if (it.t === 'map') { const Z = ZONAS[it.m]; detail = (ok ? '' : `<p class="ans">${it.mode === 'find' ? 'Era la zona que ahora se ve en color.' : 'Era el <b>' + esc(Z[it.z].n) + '</b>.'}</p>`) + `<p>${Z[it.z].w}</p>`; }
  else if (it.t === 'ord') detail = `<p class="ans">Has acertado ${x.pos.filter((k, i) => x.num[k] === i + 1).length} de ${x.pos.length} posiciones.</p>` + (it.w ? `<p>${it.w}</p>` : '');
  else if (it.t === 'cls') detail = `<p class="ans">Has colocado bien ${it.ch.filter((c, k) => x.place[k] === c[1]).length} de ${it.ch.length}.</p>` + (it.w ? `<p>${it.w}</p>` : '');
  else if (it.t === 'cap') detail = capsReport(x);
  return `<div class="fb ${ok ? 'ok' : x.score > 0 ? 'mid' : 'ko'}"><div class="fb-h">${ic(ok ? 'circle-check' : 'circle-x')}<b>${esc(x.msg)}</b>${it.t === 'cap' || it.t === 'ord' || it.t === 'cls' ? `<span class="fb-p">${Math.round(x.score * 100)} %</span>` : ''}</div>${detail}</div>`;
}
function capsReport(x) {
  const toks = x.lines.flat();
  const ups = [], traps = [];
  toks.forEach((t, k) => {
    if (t.fixed) return;
    if (t.up) ups.push({ t, on: !!x.on[k] });

  const hits = ups.filter(u => u.on).length, bad = traps.filter(u => u.on).length;
  let h = `<p class="ans">Mayúsculas: <b>${hits} de ${ups.length}</b>${bad ? ` · sobran <b>${bad}</b>` : ''}.</p><ul class="caprep">`;
  for (const u of ups) h += `<li class="${u.on ? 'r' : 'm'}">${u.on ? ic('check') : ic('x')}<b>${esc(capWord(u.t.word))}</b><span>${esc(CAP_WHY[u.t.code] || 'Va con mayúscula.')}</span></li>`;
  h += '</ul>';
  if (traps.length) {
    h += '<p class="ans">Se quedan en minúscula:</p><ul class="caprep">';
    for (const u of traps) h += `<li class="${u.on ? 'm' : 'r'}">${u.on ? ic('x') : ic('check')}<b>${esc(u.t.word.toLowerCase())}</b><span>${esc(CAP_WHY[u.t.trap] || 'Es una palabra común: va en minúscula.')}</span></li>`;

/* ---------------- RESULTADO ---------------- */
function finishRound() {
  const n = R.items.length;
  const sum = R.items.reduce((a, y) => a + y.score, 0);
  const pct = sum / n;
  const res = { pct, sum, n, kind: R.kind, reto: R.reto, newStamp: null, items: R.items };
  if (R.kind === 'reto') {
    const before = destStamped(RETO[R.reto].dest);
    const prev = S.retos[R.reto] || { best: 0, runs: 0 };
    const st = starsFor(pct);
    S.retos[R.reto] = { best: Math.max(prev.best || 0, st), last: pct, runs: (prev.runs || 0) + 1, date: today() };
    res.stars = st; res.improved = st > (prev.best || 0);
    const d = RETO[R.reto].dest;
    if (!before && destStamped(d)) { res.newStamp = d; S.stamps[d] = today(); }
  } else if (R.kind === 'mision') {
    const t = today();
    if (S.mision.last !== t) { S.mision.streak = S.mision.last === addDays(t, -1) ? (S.mision.streak || 0) + 1 : 1; S.mision.last = t; res.firstToday = true; }
    S.mision.n = (S.mision.n || 0) + 1;
    res.stars = starsFor(pct); res.streak = S.mision.streak;
  } else if (R.kind === 'aduana') {
    const nota = Math.round(pct * 100) / 10;
    const had = S.aduana.best !== null && S.aduana.best >= 7;
    S.aduana.best = S.aduana.best === null ? nota : Math.max(S.aduana.best, nota);
    S.aduana.last = nota; S.aduana.runs = (S.aduana.runs || 0) + 1;
    res.nota = nota; res.stars = starsFor(pct);
    if (!had && S.aduana.best >= 7) { res.newStamp = 'ad'; S.stamps.ad = today(); }

}

    const ord = V.qo && V.qo.length === pg.q.o.length ? V.qo : pg.q.o.map((_, k) => k);
    const opts = ord.map(k => [pg.q.o[k], k]).map(([o, k]) => { let c = ''; if (ans != null) c = k === pg.q.a ? 'right' : k === ans ? 'wrong' : 'dim'; return `<button class="opt ${c}" data-act="lq" data-k="${k}" ${ans != null ? 'disabled' : ''}>${ans != null && k === pg.q.a ? ic('check', 'oi') : ''}<span>${o}</span></button>`; }).join('');
    q = `<div class="lcheck"><div class="lc-h">${ic('target')} Comprueba: ${pg.q.q}</div><div class="opts ${pg.q.o.length <= 3 ? 'short' : ''}">${opts}</div>${ans != null ? `<p class="lc-w ${ans === pg.q.a ? 'ok' : 'ko'}"><b>${ans === pg.q.a ? '¡Bien!' : 'Casi.'}</b> ${pg.q.w}</p>` : ''}</div>`;
  }
  const body = `<article class="lesson"><h1 class="q">${esc(pg.t)}</h1>
    ${pg.fig ? `<div class="figbox">${FIG[pg.fig]}</div>` : ''}
    <div class="len"><span class="tag">EN</span><div>${pg.en}</div></div>
    <div class="les"><span class="tag">ES</span><div>${pg.es}</div></div>${q}</article>`;
  const foot = `${V.pg > 0 ? `<button class="btn sec ico" data-act="lprev" aria-label="Anterior">${ic('arrow-left')}<span class="t"> Anterior</span></button>` : ''}<button class="btn pri grow" data-act="lnext">${last ? ic('circle-check') + ' Terminar y practicar' : 'Siguiente ' + ic('chevron-right')}</button>`;
  return shell({ th: 'th-' + d.c + ' play', head, body, foot });
}

/* ---------------- PARA LA FAMILIA ---------------- */
function vFamily() {
  const head = `<button class="hbtn" data-go="home" aria-label="Volver">${ic('arrow-left')}</button><div class="htitle"><span class="hk">Lab de Física y Química</span><b>Para la familia</b></div>`;
  if (!V.open) {
    if (!V.qa) { V.qa = 6 + Math.floor(Math.random() * 4); V.qb = 6 + Math.floor(Math.random() * 4); }
    const right = V.qa * V.qb;
    const opts = shuffle([right, right + V.qa, right - V.qb, right + 2]).map(n => `<button class="opt" data-act="fam-ans" data-n="${n}" data-ok="${n === right ? 1 : 0}"><span>${n}</span></button>`).join('');
    const body = `<section class="help"><p>${ic('lock')} Esta parte es para la familia. Para entrar, resuelve:</p><h1 class="q">${V.qa} × ${V.qb} = ?</h1><div class="opts grid two-col">${opts}</div></section>`;
    return shell({ th: 'th-gen', head, body, foot: `<button class="btn sec wide" data-go="home">${ic('arrow-left')} Volver</button>` });
  }
  let rows = '';
  for (const d of DESTINOS) {
    rows += `<tr class="dr th-${d.c}"><th colspan="3">${ic(d.ic)} ${esc(d.n)} ${destStamped(d.id) ? '· medalla ✓' : ''}</th></tr>`;
    for (const r of d.retos) { const s = S.retos[r.id]; rows += `<tr><td>${esc(r.n)}</td><td>${starRow(retoBest(r.id))}</td><td>${s ? Math.round(s.last * 100) + ' % · ' + s.runs + ' ' + (s.runs === 1 ? 'vez' : 'veces') : '—'}</td></tr>`; }
  }
  const errs = Object.entries(S.err).filter(([id]) => IT[id]).sort((a, b) => b[1] - a[1]).slice(0, 10);
  const errHtml = errs.length ? '<ul class="fails">' + errs.map(([id, n]) => `<li>${failLine(inst(IT[id]))}<span class="fn">${n} ${n === 1 ? 'fallo' : 'fallos'}</span></li>`).join('') + '</ul>' : '<p class="muted">Ningún fallo pendiente.</p>';
  const boxes = [0, 0, 0, 0]; CARDS.forEach((c, k) => boxes[cardState(k).b]++);
  const body = `<section class="fam">
    <div class="kpis"><div><b>${S.mision.streak || 0}</b><span>racha de misiones</span></div><div><b>${S.mision.n || 0}</b><span>misiones hechas</span></div><div><b>${S.aduana.best === null ? '—' : fmtNota(S.aduana.best)}</b><span>mejor nota aduana</span></div><div><b>${boxes[3]}/${CARDS.length}</b><span>tarjetas dominadas</span></div></div>
    <h2 class="sec">Retos</h2><table class="ftab">${rows}</table>
    <h2 class="sec">Lo que más le cuesta</h2>${errHtml}
    <h2 class="sec">Copia de seguridad</h2>
    <p class="muted">El progreso solo está en este iPad. Guarda una copia de vez en cuando (Compartir → «Guardar en Archivos»).</p>
    <div class="row2"><button class="btn sec" data-act="backup">${ic('download')} Guardar copia</button><button class="btn sec" data-act="restore">${ic('upload')} Recuperar una copia</button></div>
    <h2 class="sec">Empezar de cero</h2>
    <button class="btn ko" data-act="wipe">${ic('trash-2')} ${V.wipe ? 'Pulsa otra vez para borrarlo todo' : 'Borrar todo el progreso'}</button>
    <p class="muted small">Versión ${APP_VERSION}. Física y Química 2.º ESO, Unit 2: matter, properties of matter, states, kinetic theory and gas laws.</p>
  </section>`;
  return shell({ th: 'th-gen', head, body, foot: `<button class="btn pri wide" data-go="home">${ic('check')} Volver a la app</button>` });
}
function backupSave() {
  const data = JSON.stringify({ app: 'lab-fyq', v: 1, at: new Date().toISOString(), state: S });
  const fname = 'lab-fyq-copia-' + today() + '.json';
  const ok = () => toast('Copia guardada');
  try {
    for (const type of ['application/json', 'text/plain']) {
      const file = new File([data], fname, { type });
      if (navigator.canShare && navigator.share && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: 'Copia del Lab de Física y Química' }).then(ok).catch(e => { if (!e || e.name !== 'AbortError') plain(); });
        return;
      }
    }
  } catch (e) { /* sigue */ }
  plain();
  function plain() {
    try {
      const url = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
      const a = document.createElement('a'); a.href = url; a.download = fname; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000); ok();
    } catch (e) { toast('Este navegador no deja guardar archivos'); }
  }
}
function backupPick() {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json,text/plain'; inp.style.display = 'none';
  document.body.appendChild(inp);
  inp.addEventListener('change', () => {
    const f = inp.files && inp.files[0]; inp.remove(); if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const o = JSON.parse(rd.result);
        if (!o || o.app !== 'lab-fyq' || !o.state || typeof o.state !== 'object' || !o.state.retos) throw new Error('no');
        const b = fresh(); for (const k of Object.keys(b)) if (o.state[k] !== undefined) b[k] = o.state[k];
        S = b; save(); toast('Copia recuperada'); render();
      } catch (e) { toast('Ese archivo no es una copia del Lab de Física y Química'); }
    };
    rd.readAsText(f);
  });
  inp.click();
}

/* ---------------- hoja de confirmación ---------------- */
function sheet(html) { const s = $('#sheet'); s.innerHTML = html ? `<div class="sh-bg" data-act="sheet-close"></div><div class="sh-card" role="dialog" aria-modal="true">${html}</div>` : ''; s.classList.toggle('on', !!html); }

/* ---------------- eventos ---------------- */
function bind() {
  if (V.name === 'play') { const x = R.items[R.i]; if (x.item.t === 'map') decorateMap(x); }
}
function onClick(ev) {
  const el = ev.target.closest('[data-act],[data-go]');
  if (!el || el.disabled) return;
  const a = el.dataset.act, g = el.dataset.go;
  if (g) { if (g === 'dest') go('dest', { d: el.dataset.d }); else if (g === 'cards') startCards(false); else go(g); return; }
  const x = R && V.name === 'play' ? R.items[R.i] : null;
  switch (a) {
    case 'learn': V = { name: 'learn', d: el.dataset.d, pg: 0, qa: null, qo: null }; render(); $('main').scrollTop = 0; break;
    case 'lq': if (V.qa == null) { V.qa = +el.dataset.k; render(); } break;
    case 'lprev': if (V.pg > 0) { V.pg--; V.qa = null; V.qo = null; render(); $('main').scrollTop = 0; } break;
    case 'lnext': if (V.pg < LESSONS[V.d].length - 1) { V.pg++; V.qa = null; V.qo = null; render(); $('main').scrollTop = 0; } else { S.learn[V.d] = today(); save(); toast('¡Teoría leída! Ahora, a practicar'); go('dest', { d: V.d }); } break;
    case 'learn-exit': go('dest', { d: V.d }); break;
    case 'reto': startRound('reto', buildReto(RETO[el.dataset.r]), { reto: el.dataset.r }); break;
    case 'mision': startRound('mision', buildMision()); break;
    case 'aduana': startRound('aduana', buildAduana()); break;
    case 'fallos': startRound('fallos', buildFallos()); break;
    case 'next-best': { const r = DESTINOS.flatMap(d => d.retos).find(rr => retoBest(rr.id) < 2) || DESTINOS.flatMap(d => d.retos).find(rr => retoBest(rr.id) < 3); if (r) startRound('reto', buildReto(r), { reto: r.id }); else startRound('aduana', buildAduana()); break; }
    case 'tip': R.tip = !R.tip; render(); break;
    case 'opt': if (x && !x.done) answer(x, +el.dataset.k, +el.dataset.k === x.item.a ? 1 : 0); break;
    case 'zopt': if (x && !x.done) answer(x, el.dataset.z, el.dataset.z === x.item.z ? 1 : 0); break;
    case 'dunno': if (x && !x.done) { if (x.item.t === 'num') { if (!x.fdone) { x.fdone = true; x.fok = false; } x.val = ''; answer(x, null, x.fok ? 0.3 : 0); } else answer(x, null, 0); } break;
    case 'fopt': if (x && !x.done && !x.fdone) { x.fdone = true; x.fok = +el.dataset.k === 0; render(); } break;
    case 'key': if (x && !x.done) { const k = el.dataset.k; let v = x.val || '';
      if (k === 'del') v = v.slice(0, -1);
      else if (k === '−') v = v.startsWith('−') ? v.slice(1) : '−' + v;
      else if (k === '.') { if (!v.includes('.')) v = (v === '' || v === '−' ? v + '0' : v) + '.'; }
      else if (v.replace(/[−.]/g, '').length < 10) v = (v === '0' ? '' : v === '−0' ? '−' : v) + k;
      x.val = v; render(); } break;
    case 'check': if (x && !x.done) check(x); break;
    case 'next': if (R.i < R.items.length - 1) { R.i++; R.tip = false; render(); $('main').scrollTop = 0; } else finishRound(); break;
    case 'ord': if (x && !x.done) { const k = +el.dataset.k; if (x.num[k]) { const n = x.num[k]; delete x.num[k]; for (const j of Object.keys(x.num)) if (x.num[j] > n) x.num[j]--; } else x.num[k] = Object.keys(x.num).length + 1; render(); } break;
    case 'ord-reset': if (x) { x.num = {}; render(); } break;
    case 'chip': if (x && !x.done) { const k = +el.dataset.k; if (x.place[k] !== undefined) { delete x.place[k]; x.bank.push(k); x.sel = null; } else x.sel = x.sel === k ? null : k; render(); ev.stopPropagation(); } break;
    case 'bin': if (x && !x.done && x.sel !== null) { x.place[x.sel] = +el.dataset.b; x.bank = x.bank.filter(k => k !== x.sel); x.sel = null; render(); } else if (x && !x.done) toast('Primero toca una palabra'); break;
    case 'tk': if (x && !x.done) { const k = +el.dataset.k; x.on[k] = !x.on[k]; el.classList.toggle('up', x.on[k]); const t = x.lines.flat()[k]; el.textContent = t.pre + (x.on[k] ? capWord(t.word) : t.word.toLowerCase()) + t.post; } break;
    case 'quit': sheet(`<h2>¿Salir de la ronda?</h2><p>Lo que llevas de esta ronda no contará para las estrellas (los fallos sí se guardan para repasarlos).</p><div class="sh-btns"><button class="btn sec" data-act="sheet-close">Seguir jugando</button><button class="btn pri" data-act="quit-yes">Salir</button></div>`); break;
    case 'quit-yes': sheet(''); { const back = R.kind === 'reto' ? { n: 'dest', d: RETO[R.reto].dest } : { n: 'home' }; R = null; go(back.n, back.d ? { d: back.d } : {}); } break;
    case 'sheet-close': sheet(''); break;
    case 'res-back': { const r = V.res; if (r.kind === 'reto') go('dest', { d: RETO[r.reto].dest }); else go('home'); break; }
    case 'card-flip': V.flip = true; render(); break;
    case 'card-yes': cardAnswer(true); break;
    case 'card-no': cardAnswer(false); break;
    case 'cards-more': startCards(true); break;
    case 'fam-ans': if (el.dataset.ok === '1') { V.open = true; render(); } else { toast('Esa no es. Prueba otra vez'); V.qa = null; render(); } break;
    case 'backup': backupSave(); break;
    case 'restore': backupPick(); break;
    case 'wipe': if (V.wipe) { S = fresh(); save(); V.wipe = false; toast('Progreso borrado'); render(); } else { V.wipe = true; render(); } break;
  }
}

/* ---------------- arranque ---------------- */
function boot() {
  document.addEventListener('click', onClick);
  render();
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    repairMates();
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
}
/* Si es la primera visita y la página llegó a través del service worker de Misión Mates
   (comparten carpeta en GitHub), ese service worker guarda esta página como si fuera la suya.
   Aquí se le devuelve su página correcta, para que Misión Mates siga funcionando sin Internet. */
async function repairMates() {
  try {
    const c = navigator.serviceWorker.controller;
    if (!c || !/\/mision-mates\/sw\.js$/.test(new URL(c.scriptURL).pathname) || !window.caches) return;
    const keys = (await caches.keys()).filter(k => /^mision-mates-\d+$/.test(k));
    if (!keys.length) return;
    const url = new URL('../index.html', location.href).href;
    const res = await fetch(url + '?r=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) return;
    const txt = await res.clone().text();
    if (!txt.includes('Misión Mates')) return;
    for (const k of keys) { const cache = await caches.open(k); await cache.put(url, new Response(txt, { headers: { 'Content-Type': 'text/html; charset=utf-8' } })); }
  } catch (e) { /* no pasa nada */ }
}
boot();
